[project]
name = "ai-accountant"
version = "0.1.0"
description = "AI-ბუღალტერი: rs.ge ავტომატიზაცია + LLM Router (Claude / ChatGPT / Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    # LLM პროვაიდერების ოფიციალური SDK-ები (მომხმარებლის საკუთარი გასაღებით - BYOK)
    "anthropic>=1.8",
    "openai>=3.0",
    "google-genai>=2.0",
    # rs.ge
    "playwright>=1.50",
    "zeep>=4.3",
    # დოკუმენტები
    "openpyxl>=3.1",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: requires Chromium (Playwright)",
    "postgres: requires a PostgreSQL server (TEST_DATABASE_URL)",
    "redis: requires a Redis server (TEST_REDIS_URL)",
]
