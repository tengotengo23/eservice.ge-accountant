[project]
name = "ai-accountant"
version = "0.1.0"
description = "AI-ბუღალტერი: rs.ge ავტომატიზაცია + LLM Router (Claude / ChatGPT / Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    # LLM პროვაიდერების ოფიციალური SDK-ები (მომხმარებლის საკუთარი გასაღებით - BYOK)
    "anthropic>=1.8",
    "openai>=3.0",
    "google-genai>=2.0",
    # rs.ge
    "playwright>=1.50",
    "zeep>=4.3",
    # დოკუმენტები
    "openpyxl>=3.1",
    # OIDC access token (JWT) შემოწმება
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: requires Chromium (Playwright)",
    "postgres: requires a PostgreSQL server (TEST_DATABASE_URL)",
    "redis: requires a Redis server (TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W/F - საბაზისო; I - იმპორტების რიგი; B - ბაგების პატერნები; UP - თანამედროვე სინტაქსი;
# S - უსაფრთხოება (bandit); ASYNC - ბლოკირებადი გამოძახებები async კოდში
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "B008",     # FastAPI-ის Depends()/File() default არგუმენტში - framework-ის იდიომაა
    "UP042",    # (str, Enum) -> StrEnum ცვლის str()-ის შედეგს; DB/JSON მნიშვნელობები .value-თი მიდის
    "S311",     # random მხოლოდ retry-ის jitter-ისთვის, არა კრიპტოგრაფიისთვის
    "S608",     # SQL f-string-ებში მხოლოდ კოდის კონსტანტებია (სვეტების სია); მნიშვნელობები - %s პარამეტრებით
    "ASYNC109", # timeout პარამეტრი შეგნებულია (ეხება rs.ge-ს ლოდინს)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert და სატესტო "პაროლები"
