[project]
name = "ai-accountant"
version = "0.2.0"
description = "AI-ბუღალტერი: rs.ge ავტომატიზაცია + LLM Router (Claude / ChatGPT / Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "arq>=0.26",      # worker-ების რიგი (Redis)
    "tzdata",         # zoneinfo slim image-ებშიც (Asia/Tbilisi)
    # LLM პროვაიდერების ოფიციალური SDK-ები (მომხმარებლის საკუთარი გასაღებით - BYOK)
    "anthropic>=1.8",
    "openai>=3.0",
    "google-genai>=2.0",
    # rs.ge
    "playwright>=1.50",
    "zeep>=4.3",
    # OIDC (JWT + JWKS)
    "PyJWT[crypto]>=2.9",
    # დოკუმენტები
    "openpyxl>=3.1",
    # Asia/Tbilisi დროის სარტყელი იმ სისტემებზეც, სადაც IANA ბაზა არ არის (Windows, მინიმალური image-ები)
    "tzdata>=2024.1",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.15"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: requires Chromium (Playwright)",
    "postgres: requires a PostgreSQL server (TEST_DATABASE_URL)",
    "redis: requires a Redis server (TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "B008",      # FastAPI: Depends()/File() ნაგულისხმევ არგუმენტში - ფრეიმვორკის იდიომია
    "UP042",     # StrEnum-ზე გადასვლა str()-ის ქცევას ცვლის ("Provider.CLAUDE" -> "claude")
    "S311",      # random მხოლოდ retry jitter-ისთვის (არა კრიპტოგრაფია)
    "ASYNC109",  # Playwright-ის ms timeout-ები გადაეცემა Playwright-ს, asyncio timeout არ არის
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108"]
"app/rsge/selectors.py" = ["S105"]  # CSS სელექტორები ("password_input"), არა პაროლები
"app/services/*.py" = ["S608"]      # SQL-ში ჩასმულია მხოლოდ მოდულის კონსტანტა (სვეტების სია); მნიშვნელობები - პარამეტრებით
